name: Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        profile:
          - jooan_w3u_t23n_sc2336p_unique_eth_atbm6132u
          - jooan_w3u_t23n_sc2336p_dual_eth_atbm6132u
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firmware
        id: build
        run: |
          docker run --rm --userns=keep-id \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/overrides:/overrides \
            -w /workspace \
            -e BR2_DL_DIR=/dl \
            ghcr.io/themactep/thingino-builder-image:latest \
            bash -c "make CAMERA=${{ matrix.profile }} defconfig build_fast pack"

      - name: Collect artifacts
        id: artifacts
        run: |
          OUT_DIR="output/master/${{ matrix.profile }}-3.10.14-uclibc/images"
          BIN=$(ls "$OUT_DIR"/thingino-*.bin)
          MD=$(ls "$OUT_DIR"/*.md)
          SHA=$(ls "$OUT_DIR"/SHA256SUMS.txt 2>/dev/null || sha256sum "$BIN" > "$OUT_DIR/SHA256SUMS.txt" && echo "$OUT_DIR/SHA256SUMS.txt")
          
          echo "bin=$BIN" >> $GITHUB_OUTPUT
          echo "md=$MD" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Verify image magic numbers
        run: |
          BIN="${{ steps.artifacts.outputs.bin }}"
          echo "Validating $BIN"
          xxd -l 4 "$BIN" | grep -q "06050403" || { echo "FAIL: bad u-boot magic"; exit 1; }
          xxd -s 0x70000 -l 4 "$BIN" | grep -q "27051956" || { echo "FAIL: bad kernel magic"; exit 1; }
          xxd -s 0x200000 -l 4 "$BIN" | grep -q "68737173" || { echo "FAIL: bad rootfs magic"; exit 1; }
          xxd -s 0x710000 -l 4 "$BIN" | grep -q "8519" || { echo "FAIL: bad data magic"; exit 1; }
          echo "OK: $BIN"

      - name: Generate SBOM
        id: sbom
        run: |
          syft "dir:${{ github.workspace }}" -o spdx-json > sbom-${{ matrix.profile }}.spdx.json
          echo "file=sbom-${{ matrix.profile }}.spdx.json" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.artifacts.outputs.bin }}
            ${{ steps.artifacts.outputs.md }}
            ${{ steps.artifacts.outputs.sha }}
            ${{ steps.sbom.outputs.file }}
          draft: false
          prerelease: false
          generate_release_notes: true
